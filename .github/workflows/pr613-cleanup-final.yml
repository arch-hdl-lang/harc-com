name: PR 613 cleanup

on:
  pull_request:
    types: [edited]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.number == 613 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore single component module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/ir/lower/components_impl.rs')
          text = src.read_text()
          start_marker = "/// True when a consumer's subscribing `on <ev>` handler lives ONLY under"
          end_marker = "/// True when a composite-component transactor is a *reactive monitor /"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = r'''/// True when at least one always-visible `in event` has subscribers only under
/// `when active`.
///
/// This must be decided per event, not per transactor. An always-on
/// `on req1(v)` does not make `req2` safe on a passive instance if the only
/// `on req2(v)` lives under `when active`: `emit t.req2(...)` would otherwise
/// iterate an empty subscriber vector and silently drop the transaction.
///
/// Inputs declared themselves under `when active` are excluded: they are not
/// part of a passive instance's visible surface, and ordinary activation checks
/// reject attempts to emit through them.
pub(crate) fn transactor_is_active_only_consumer(t: &TransactorDecl) -> bool {
    if !transactor_is_event_driven(t) {
        return false;
    }

    fn subscription_event(h: &crate::ast::OnHandler) -> Option<&str> {
        if h.periodic {
            return None;
        }
        let ExprKind::Call { callee, .. } = &*h.event.kind else {
            return None;
        };
        let ExprKind::Ident(id) = &*callee.kind else {
            return None;
        };
        Some(id.name.as_str())
    }

    let is_always_input = |event: &str| {
        t.items.iter().any(|item| {
            matches!(
                item,
                ComponentItem::Field(field)
                    if is_event_field(field)
                        && matches!(field.direction, Some(Direction::In))
                        && field.name.name == event
            )
        })
    };

    let has_always_subscriber = |event: &str| {
        t.items.iter().any(|item| {
            matches!(
                item,
                ComponentItem::OnHandler(handler)
                    if subscription_event(handler) == Some(event)
            )
        })
    };

    t.when_active
        .iter()
        .flatten()
        .filter_map(|item| match item {
            ComponentItem::OnHandler(handler) => subscription_event(handler),
            _ => None,
        })
        .any(|event| is_always_input(event) && !has_always_subscriber(event))
}

'''
          Path('src/ir/lower/components.rs').write_text(text[:start] + replacement + text[end:])
          src.unlink()
          PY

      - name: Format and validate
        run: |
          cargo fmt --all
          cargo test --release --test tbir_active_only_consumer_multi_event
          cargo test --release

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr613-cleanup-final.yml
          git add src/ir/lower/components.rs src/ir/lower/components_impl.rs
          git commit -m "fix(tbir): restore single component lowering module"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
