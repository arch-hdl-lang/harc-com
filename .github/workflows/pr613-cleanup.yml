name: Collapse PR 613 classifier patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.number == 613 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Collapse facade into original component module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          impl = Path('src/ir/lower/components_impl.rs')
          text = impl.read_text()
          start_marker = "/// True when a consumer's subscribing `on <ev>` handler lives ONLY under"
          end_marker = "/// True when a composite-component transactor is a *reactive monitor /"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = r'''/// True when an always-visible consumer input has subscribers only under
/// `when active`. A `passive` binding would still expose that `in event`,
/// but register no subscriber for it, so `emit <inst>.<event>(...)` would
/// silently fan out over an empty vector.
///
/// This is intentionally checked PER INPUT EVENT. A transactor may have an
/// always-on handler for `req1` and an active-only handler for `req2`; the
/// former must not make a passive binding look safe when `req2` would still
/// drop every transaction. Conversely, an input field that is itself declared
/// under `when active` is not exposed by a passive instance and is not a dead
/// always-visible input.
pub(crate) fn transactor_is_active_only_consumer(t: &TransactorDecl) -> bool {
    if !transactor_is_event_driven(t) {
        return false;
    }

    fn subscription_event(h: &crate::ast::OnHandler) -> Option<&str> {
        if h.periodic {
            return None;
        }
        let ExprKind::Call { callee, .. } = &*h.event.kind else {
            return None;
        };
        let ExprKind::Ident(id) = &*callee.kind else {
            return None;
        };
        Some(id.name.as_str())
    }

    let is_always_input = |event: &str| {
        t.items.iter().any(|it| {
            matches!(
                it,
                ComponentItem::Field(f)
                    if is_event_field(f)
                        && matches!(f.direction, Some(Direction::In))
                        && f.name.name.as_str() == event
            )
        })
    };
    let has_always_subscriber = |event: &str| {
        t.items.iter().any(|it| {
            matches!(
                it,
                ComponentItem::OnHandler(h)
                    if subscription_event(h) == Some(event)
            )
        })
    };

    t.when_active
        .as_deref()
        .into_iter()
        .flatten()
        .any(|it| {
            let ComponentItem::OnHandler(h) = it else {
                return false;
            };
            let Some(event) = subscription_event(h) else {
                return false;
            };
            is_always_input(event) && !has_always_subscriber(event)
        })
}

'''
          Path('src/ir/lower/components.rs').write_text(text[:start] + replacement + text[end:])
          PY
          rm src/ir/lower/components_impl.rs

      - name: Format and test
        run: |
          cargo fmt --all
          cargo test --release --test tbir_active_only_consumer_multi_event
          cargo test --release

      - name: Commit clean patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr613-cleanup.yml
          git add src/ir/lower/components.rs src/ir/lower/components_impl.rs tests/tbir_active_only_consumer_multi_event.rs
          git commit -m "fix(tbir): keep per-event consumer gate in component module"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
