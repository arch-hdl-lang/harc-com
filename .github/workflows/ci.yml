name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-and-test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Z3 (needed by harc's Z3 bindings at link time)
        run: sudo apt-get update && sudo apt-get install -y libz3-dev

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo build
        run: cargo build --release --all-targets

      - name: cargo test
        run: cargo test --release

  parse-fixtures:
    # Every fixture must round-trip parse + check cleanly. This catches
    # AST/parser regressions that the snapshot suite alone won't.
    name: harc check fixtures
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install -y libz3-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build harc
        run: cargo build --release --bin harc

      - name: harc check every fixture
        run: |
          set -euo pipefail
          fail=0
          for f in tests/fixtures/*.harc; do
            if ! ./target/release/harc check "$f"; then
              echo "::error file=$f::harc check failed"
              fail=1
            fi
          done
          exit $fail

      - name: harc fmt round-trip
        # Pretty-print → reparse → pretty-print again must be a fixed point.
        run: |
          set -euo pipefail
          fail=0
          for f in tests/fixtures/*.harc; do
            tmp1=$(mktemp)
            tmp2=$(mktemp)
            ./target/release/harc fmt "$f" > "$tmp1"
            if ! ./target/release/harc check "$tmp1"; then
              echo "::error file=$f::pretty-printed output failed harc check"
              fail=1
              continue
            fi
            ./target/release/harc fmt "$tmp1" > "$tmp2"
            if ! diff -q "$tmp1" "$tmp2" > /dev/null; then
              echo "::error file=$f::harc fmt is not idempotent"
              diff "$tmp1" "$tmp2" | head -40
              fail=1
            fi
          done
          exit $fail

  run-fixtures:
    # End-to-end: build harc + Verilator-compile each vendored DUT +
    # run the matching .harc fixture, asserting "ALL TESTS PASSED".
    # This is what catches codegen regressions that parse-only CI misses.
    name: harc sim fixtures
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Z3 + clang
        # clang is needed because the emitted test `.cpp` uses
        # `#pragma clang optimize off` to work around a C++20
        # lambda-coroutine miscompile at `-Os` (verilator default)
        # that affects both clang and GCC. GCC's equivalent pragma
        # doesn't propagate through coroutine codegen, so we use
        # clang on both platforms. See `run_verilator` in
        # src/main.rs and the prelude in src/codegen/cpp_tb.rs
        # for the full rationale.
        run: |
          sudo apt-get update
          sudo apt-get install -y libz3-dev clang \
                                  git make autoconf flex bison g++ help2man perl python3 \
                                  numactl perl-doc libfl2 libfl-dev zlib1g zlib1g-dev

      # Verilator: install from source. Ubuntu's apt package is
      # 5.020 which rejects `<=` array assignment inside `for`
      # loops (BLKLOOPINIT) — used in several arch-com DUTs we
      # vendor (e.g. buf_mgr's reset for-loops over head/tail/count
      # arrays, which legitimately need non-blocking assignment per
      # always_ff convention). Verilator 5.034 fixes this; we pin
      # to the v5.034 tag for reproducibility. Cached across runs
      # so this only pays the build cost on cache miss.
      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-v5.034-ubuntu-${{ runner.os }}

      - name: Build Verilator from source (cache miss)
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --branch v5.034 --depth 1 https://github.com/verilator/verilator.git /tmp/verilator-src
          cd /tmp/verilator-src
          autoconf
          ./configure --prefix=/opt/verilator
          make -j"$(nproc)"
          sudo make install

      - name: Add Verilator to PATH
        run: |
          echo "/opt/verilator/bin" >> "$GITHUB_PATH"
          /opt/verilator/bin/verilator --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build harc
        run: cargo build --release --bin harc

      - name: Run all fixtures end-to-end
        env:
          # Force the verilator build to use clang++ — see comment
          # on `CXX=` in src/main.rs's run_verilator(). HARC_CXX
          # propagates via -MAKEFLAGS into the verilator makefile.
          HARC_CXX: clang++
        run: ./tests/run_fixtures.sh

      - name: Run negative-fixture runner (expects FATAL / abort)
        env:
          HARC_CXX: clang++
        run: ./tests/run_negative_fixtures.sh

  check-backends:
    # sim<->SV equivalence net: run representative arch-com designs under
    # BOTH backends (ARCH native sim via --dut, Verilator via --sv) with
    # `harc sim --check-backends` and assert the per-cycle traces match.
    # This is the standing invariant that catches the silent-divergence
    # class (e.g. a mutex policy or Vec<Bus> lowering that one backend
    # disagrees with the other). Needs BOTH compilers, so it checks out
    # and builds arch-com alongside harc.
    name: harc sim<->SV parity
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Check out arch-com (for the arch compiler + example designs)
        uses: actions/checkout@v4
        with:
          repository: arch-hdl-lang/arch-com
          path: arch-com

      - name: Install Z3 + clang
        run: |
          sudo apt-get update
          sudo apt-get install -y libz3-dev clang \
                                  git make autoconf flex bison g++ help2man perl python3 \
                                  numactl perl-doc libfl2 libfl-dev zlib1g zlib1g-dev

      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-v5.034-ubuntu-${{ runner.os }}

      - name: Build Verilator from source (cache miss)
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --branch v5.034 --depth 1 https://github.com/verilator/verilator.git /tmp/verilator-src
          cd /tmp/verilator-src
          autoconf
          ./configure --prefix=/opt/verilator
          make -j"$(nproc)"
          sudo make install

      - name: Add Verilator to PATH
        run: |
          echo "/opt/verilator/bin" >> "$GITHUB_PATH"
          /opt/verilator/bin/verilator --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build harc
        run: cargo build --release --bin harc

      - name: Build arch (the ARCH compiler from arch-com)
        run: cargo build --release --bin arch --manifest-path arch-com/Cargo.toml

      - name: Run sim<->SV parity net
        env:
          HARC_CXX: clang++
          ARCH_COM: arch-com
        run: ./tests/run_check_backends.sh
