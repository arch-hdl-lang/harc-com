name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: cargo test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arch-hdl-lang/harc-ci@sha256:ee3d4421cb32e657c2b34843f02c3d2945bfe8311480144d7061aff6309fe9a5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Test fixture sharding
        run: python3 tests/test_fixture_sharding.py

      - name: Cache cargo registry + target
        uses: actions/cache@v6
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-v1-

      - name: cargo build
        run: cargo build --release --all-targets

      - name: cargo test
        # HARC_REQUIRE_VERILATOR turns a Verilator-less skip into a hard
        # failure. The prebuilt CI image is what makes these tests
        # run; this is what keeps them running — without it, a future
        # change to the steps above would put them straight back to
        # passing in 0.00s without ever executing.
        run: cargo test --release
        env:
          HARC_REQUIRE_VERILATOR: "1"

  parse-fixtures:
    # Every fixture must round-trip parse + check cleanly. This catches
    # AST/parser regressions that the snapshot suite alone won't.
    name: harc check fixtures
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arch-hdl-lang/harc-ci@sha256:ee3d4421cb32e657c2b34843f02c3d2945bfe8311480144d7061aff6309fe9a5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    needs: build-and-test
    steps:
      - uses: actions/checkout@v6

      - name: fixture registration
        # A fixture with a DUT that no runner references never executes, and
        # the omission is invisible — CI stays green. See #514.
        run: ./tests/check_fixture_registration.sh

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-v1-

      - name: Build harc
        run: cargo build --release --bin harc

      - name: harc check every fixture
        run: |
          set -euo pipefail
          fail=0
          for f in tests/fixtures/*.harc; do
            if ! ./target/release/harc check "$f"; then
              echo "::error file=$f::harc check failed"
              fail=1
            fi
          done
          exit $fail

      - name: v1 vs TB-IR emitted parity
        # Acceptance + solver-constraint-text parity between the two
        # emitters, across the whole fixture corpus. Complements
        # run_tbir_equiv.sh, which trace-diffs: that needs Verilator, needs
        # both backends to build AND run, and is therefore blind to a
        # one-sided rejection — the shape harc#559 shipped with every job
        # green. This one only needs --emit-only, so it lives in the fast
        # job and does not need a fixture to be runnable to compare it.
        # Scope is the shared table (tests/fixtures.tbl). See harc#551.
        run: ./tests/run_emit_parity.sh
        env:
          HARC: ./target/release/harc

      - name: harc fmt round-trip
        # Pretty-print → reparse → pretty-print again must be a fixed point.
        run: |
          set -euo pipefail
          fail=0
          for f in tests/fixtures/*.harc; do
            tmp1=$(mktemp)
            tmp2=$(mktemp)
            ./target/release/harc fmt "$f" > "$tmp1"
            if ! ./target/release/harc check "$tmp1"; then
              echo "::error file=$f::pretty-printed output failed harc check"
              fail=1
              continue
            fi
            ./target/release/harc fmt "$tmp1" > "$tmp2"
            if ! diff -q "$tmp1" "$tmp2" > /dev/null; then
              echo "::error file=$f::harc fmt is not idempotent"
              diff "$tmp1" "$tmp2" | head -40
              fail=1
            fi
          done
          exit $fail

  run-fixtures:
    # End-to-end: build harc + Verilator-compile each vendored DUT +
    # run the matching .harc fixture, asserting "ALL TESTS PASSED".
    # This is what catches codegen regressions that parse-only CI misses.
    name: harc sim fixtures (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arch-hdl-lang/harc-ci@sha256:ee3d4421cb32e657c2b34843f02c3d2945bfe8311480144d7061aff6309fe9a5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: "4"
    steps:
      - uses: actions/checkout@v6

      - name: Set up ccache (masquerade clang++)
        run: |
          mkdir -p "$HOME/.ccache-bin"
          ln -sf "$(command -v ccache)" "$HOME/.ccache-bin/clang++"
          ln -sf "$(command -v ccache)" "$HOME/.ccache-bin/clang"
          echo "$HOME/.ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
          # Normalize the per-fixture absolute build paths (all under the
          # workspace) so the shared verilated runtime and same-DUT object
          # files hit across fixtures, not just on identical re-runs.
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=time_macros" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-sim-shard-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            ccache-sim-shard-${{ matrix.shard }}-
            ccache-sim-

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-v1-

      - name: Build harc
        run: cargo build --release --bin harc

      - name: ccache zero stats
        run: ccache -z

      - name: Run all fixtures end-to-end
        env:
          # Force the verilator build to use clang++ — see comment
          # on `CXX=` in src/main.rs's run_verilator(). HARC_CXX
          # propagates via -MAKEFLAGS into the verilator makefile.
          HARC_CXX: clang++
        run: ./tests/run_fixtures.sh

      - name: Run negative-fixture runner (expects FATAL / abort)
        if: matrix.shard == 0
        env:
          HARC_CXX: clang++
        run: ./tests/run_negative_fixtures.sh

      - name: VCD dup-dump smoke test (issue #477)
        if: matrix.shard == 0
        # A clocked TB with an active `phase post_eval` service, run under
        # VCD tracing, must not emit Verilator `previous dump at t=`
        # warnings (duplicate same-timestamp dump). Reuses the image toolchain
        # and harc build above.
        env:
          HARC_CXX: clang++
        run: ./tests/run_vcd_dump_smoke.sh

      - name: v1-vs-tbir codegen equivalence harness
        # Every registered fixture (tests/tbir_equiv_fixtures.txt) must
        # produce identical semantic traces under both C++ emitters
        # (`--codegen v1` and `--codegen tbir`). Lives in this job to
        # reuse the image toolchain and harc build above.
        # ARCH_BIN is intentionally NOT set here (no arch checkout in
        # this job), so the optional --dut sweep self-skips.
        env:
          HARC_CXX: clang++
        run: ./tests/run_tbir_equiv.sh

      - name: ccache stats
        if: always()
        run: ccache -s

  run-fixtures-complete:
    # Preserve the required check name while aggregating all matrix shards.
    name: harc sim fixtures
    runs-on: ubuntu-latest
    needs: run-fixtures
    if: always()
    steps:
      - name: Require every fixture shard to pass
        env:
          FIXTURE_RESULT: ${{ needs.run-fixtures.result }}
        run: test "$FIXTURE_RESULT" = success

  run-cosim-fixtures:
    # Same fixture table as run-fixtures, through the `--cosim dpi`
    # backend (spec §10 simulator-owned-time DPI-C co-sim): generated
    # HarcCosimTop.sv harness owns the clock, the TB runs as a passive
    # DPI-C runtime on the thread bridge, and DUT access crosses the
    # boundary through generated typed accessors. Full parity with the
    # direct backend (130/130) is the standing invariant — this job is
    # the gate that keeps the co-sim contract from rotting. Mirrors
    # run-fixtures' prebuilt toolchain and reuses its ccache/cargo caches.
    name: harc sim fixtures (cosim dpi) (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arch-hdl-lang/harc-ci@sha256:ee3d4421cb32e657c2b34843f02c3d2945bfe8311480144d7061aff6309fe9a5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: "4"
    steps:
      - uses: actions/checkout@v6

      - name: Set up ccache (masquerade clang++)
        # Same masquerade as run-fixtures (see the rationale there).
        # Co-sim builds share less object code with the direct builds
        # (`--binary --timing` vs `--cc --no-timing`) but the verilated
        # runtime and per-DUT model objects still hit across fixtures.
        run: |
          mkdir -p "$HOME/.ccache-bin"
          ln -sf "$(command -v ccache)" "$HOME/.ccache-bin/clang++"
          ln -sf "$(command -v ccache)" "$HOME/.ccache-bin/clang"
          echo "$HOME/.ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=time_macros" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-cosim-shard-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            ccache-cosim-shard-${{ matrix.shard }}-
            ccache-cosim-
            ccache-sim-

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-v1-

      - name: Build harc
        run: cargo build --release --bin harc

      - name: ccache zero stats
        run: ccache -z

      - name: Run all fixtures through --cosim dpi
        env:
          HARC_CXX: clang++
        run: ./tests/run_cosim_fixtures.sh

      - name: Run negative fixtures through --cosim dpi (expects $fatal path)
        if: matrix.shard == 0
        # Exercises the failure half of the co-sim protocol —
        # RC_DONE_FAIL -> $fatal -> nonzero exit — which the all-green
        # parity sweep never touches.
        env:
          HARC_CXX: clang++
        run: ./tests/run_cosim_negative_fixtures.sh

      - name: ccache stats
        if: always()
        run: ccache -s

  check-backends:
    # sim<->SV equivalence net: run representative arch-com designs under
    # BOTH backends (ARCH native sim via --dut, Verilator via --sv) with
    # `harc sim --check-backends` and assert the per-cycle traces match.
    # This is the standing invariant that catches the silent-divergence
    # class (e.g. a mutex policy or Vec<Bus> lowering that one backend
    # disagrees with the other). Needs BOTH compilers, so it checks out
    # and builds arch-com alongside harc.
    name: harc sim<->SV parity
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arch-hdl-lang/harc-ci@sha256:ee3d4421cb32e657c2b34843f02c3d2945bfe8311480144d7061aff6309fe9a5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    needs: build-and-test
    steps:
      - uses: actions/checkout@v6

      # Pin the ARCH compiler to a released version. The prebuilt binary is
      # installed below via cargo-dist (no slow source build); this sparse,
      # shallow checkout only fetches the example .arch/.harc design files
      # the parity net runs, at the SAME tag so designs match the binary.
      # Bump ARCH_VERSION (here + the installer step) to test against a newer
      # released arch.
      - name: Check out arch-com example designs (pinned, sparse)
        uses: actions/checkout@v6
        with:
          repository: arch-hdl-lang/arch-com
          ref: v0.70.4
          path: arch-com
          fetch-depth: 1
          sparse-checkout: examples/nic400
          sparse-checkout-cone-mode: true

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-v1-

      - name: Build harc
        run: cargo build --release --bin harc

      # Install the prebuilt ARCH compiler via cargo-dist — a few-second
      # binary download instead of a ~1-2 min source build. Pinned to the
      # same tag as the design checkout above.
      - name: Install arch v0.70.4 (cargo-dist prebuilt)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/arch-hdl-lang/arch-com/releases/download/v0.70.4/arch-installer.sh | sh
          "$HOME/.cargo/bin/arch" --version

      - name: Run sim<->SV parity net
        env:
          HARC_CXX: clang++
          # arch sim's TB compile defaults to g++, which on Linux is real GCC
          # and miscompiles the C++20 coroutine testbench scheduler. v0.70.4+
          # honors ARCH_CXX (mirrors HARC_CXX) — select clang++. (Replaced the
          # earlier g++ -> clang++ PATH shim once arch-com#538 shipped.)
          ARCH_CXX: clang++
          ARCH_COM: arch-com
        run: |
          # Absolute path avoids coreutils `arch` (prints machine arch) shadowing.
          export ARCH="$HOME/.cargo/bin/arch"
          ./tests/run_check_backends.sh
