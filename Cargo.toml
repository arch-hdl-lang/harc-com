[package]
name = "harc"
version = "0.1.0"
edition = "2021"
description = "Compiler for the HARC verification language (sister to ARCH)"
license = "LGPL-3.0-or-later"

[[bin]]
name = "harc"
path = "src/main.rs"

[dependencies]
logos = "0.14"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
insta = "1"
