[package]
name = "harc"
version = "0.2.0"
edition = "2021"
description = "Compiler for the HARC verification language (sister to ARCH)"
license = "LGPL-3.0-or-later"
repository = "https://github.com/arch-hdl-lang/harc-com"

[[bin]]
name = "harc"
path = "src/main.rs"

[dependencies]
logos = "0.14"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
